# New release: `rake release:run` (see README.md), started manually from the Actions tab
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (x.y.z). Leave empty to use VERSION without .pre suffix"
        required: false
        type: string
      next_version:
        description: "Next development version (x.y.z). Leave empty to increment the minor version. .pre is appended"
        required: false
        type: string

permissions:
  # push the release commits and tag, create the GitHub release
  contents: write

env:
  # Versions used by the tests of the release, from their GitHub releases: the packages of Ubuntu are too old
  PANDOC_VERSION: "3.12.1"
  TYPST_VERSION: "0.15.1"

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"

      - name: Install tools of the tests
        run: |
          sudo apt-get update
          sudo apt-get install -y inkscape texlive-luatex texlive-latex-extra texlive-fonts-extra fonts-lmodern fonts-dejavu-core fonts-noto-color-emoji poppler-utils
          curl -fsSL -o "$RUNNER_TEMP/pandoc.deb" "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-1-amd64.deb"
          sudo dpkg -i "$RUNNER_TEMP/pandoc.deb"
          curl -fsSL "https://github.com/typst/typst/releases/download/v${TYPST_VERSION}/typst-x86_64-unknown-linux-musl.tar.xz" | sudo tar -xJ -C /usr/local/bin --strip-components=1 typst-x86_64-unknown-linux-musl/typst
          pandoc --version | head -1
          typst --version

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          # inputs in env vars, not in the script: no injection
          VERSION: ${{ inputs.version }}
          NEXT_VERSION: ${{ inputs.next_version }}
        run: |
          rake "release:run[${VERSION},${NEXT_VERSION}]"
